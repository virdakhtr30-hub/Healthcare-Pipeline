services:
  airflow-standalone:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: de_healthcare_airflow
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__EXECUTOR: "SequentialExecutor"
      AIRFLOW__WEBSERVER__WEB_SERVER_PORT: "8080"
    volumes:
      - ./dags:/opt/airflow/dags
      - ..:/opt/airflow/project
    ports:
      - "8080:8080"
    command: standalone